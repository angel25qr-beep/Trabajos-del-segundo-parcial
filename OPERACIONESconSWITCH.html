<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Operaciones</title>
</head>
<body>

<script>

    let N1 = Number(prompt("Introduce el primer numero para la suma"));
    let N2 = Number(prompt("Introduce el segundo numero para la suma"));

    let operacion = 1;

    switch (operacion) {
        case 1:
            let suma = N1 + N2;
            document.write("La suma es: " + suma + "<br>");
    }

    N1 = Number(prompt("Introduce el primer numero para la resta"));
    N2 = Number(prompt("Introduce el segundo numero para la resta"));

    operacion = 2;

    switch (operacion) {
        case 2:
            let resta = N1 - N2;
            document.write("La resta es: " + resta + "<br>");
    }

    N1 = Number(prompt("Introduce el primer numero para la multiplicacion"));
    N2 = Number(prompt("Introduce el segundo numero para la multiplicacion"));

    operacion = 3;

    switch (operacion) {
        case 3:
            let multiplicacion = N1 * N2;
            document.write("La multiplicacion es: " + multiplicacion + "<br>");
    }

    N1 = Number(prompt("Introduce el primer numero para la division"));
    N2 = Number(prompt("Introduce el segundo numero para la division"));

    operacion = 4;

    switch (operacion) {
        case 4:
            if (N2 != 0) {
                let division = N1 / N2;
                document.write("La division es: " + division);
            } else {
                document.write("No se puede dividir entre cero.");
            }
    }

</script>

<br><br>

    Regresar al index
</a>

</body>
</html>
